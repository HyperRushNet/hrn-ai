<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://cdn-icons-png.flaticon.com data:; connect-src 'self' https://gen.pollinations.ai https://enter.pollinations.ai;">
  
  <title>HyperRush AI | Pro</title>
  <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/128/18548/18548385.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/HyperRushNet/hrn-ai/client/1.0.6.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #050505; --bg-surface: #0a0a0b; --bg-elevated: #141416;
      --border-subtle: hsla(0,0%,100%,0.08); --text-main: #f8fafc;
      --text-muted: #a1a1aa; --accent: #38bdf8; --danger: #ef4444;
      --sidebar-w: 280px; --content-width: 760px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-base); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100dvh; display: flex; overflow: hidden; }

    /* Sidebar & Layout */
    .sidebar { width: var(--sidebar-w); background: var(--bg-surface); border-right: 1px solid var(--border-subtle); padding: 16px; display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; }
    @media (max-width: 1024px) { .sidebar { position: fixed; height: 100%; transform: translateX(-100%); } body.sidebar-open .sidebar { transform: translateX(0); } }
    
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 90; opacity: 0; pointer-events: none; transition: 0.3s; }
    body.sidebar-open .sidebar-overlay { opacity: 1; pointer-events: auto; }

    .new-btn { padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); border-radius: 12px; color: #fff; cursor: pointer; font-weight: 600; transition: 0.2s; margin-bottom: 20px; }
    .new-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--accent); }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 10px 12px; border-radius: 10px; font-size: 13.5px; color: var(--text-muted); cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; border: 1px solid transparent; }
    .chat-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .chat-item.active { background: rgba(56,189,248,0.1); border-color: rgba(56,189,248,0.2); color: var(--accent); }
    .delete-btn { opacity: 0; background: none; border: none; color: #71717a; font-size: 18px; padding: 0 4px; cursor: pointer; }
    .chat-item:hover .delete-btn { opacity: 1; }

    /* Main Area */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    .header { height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); background: rgba(5,5,5,0.7); backdrop-filter: blur(12px); z-index: 50; }
    
    .status-group { display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.5px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .status-dot.busy { background: var(--accent); animation: pulse 1.5s infinite; box-shadow: 0 0 8px var(--accent); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Chat Content */
    .chat-scroll { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
    .container { max-width: var(--content-width); margin: 0 auto; padding-bottom: 120px; }
    
    .msg { margin-bottom: 32px; animation: slideUp 0.4s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg.user { display: flex; justify-content: flex-end; }
    .msg.user .bubble { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 20px 20px 4px 20px; padding: 12px 18px; max-width: 85%; line-height: 1.5; color: #fff; }

    .msg.ai .md-body { line-height: 1.7; font-size: 15px; color: #e2e8f0; }
    .md-body p { margin-bottom: 16px; }
    .md-body code { font-family: 'JetBrains Mono'; background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }

    /* Code Blocks */
    .code-wrapper { margin: 20px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-subtle); background: #011627; }
    .code-header { background: rgba(255,255,255,0.03); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); }
    .code-lang { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; }
    .copy-btn { font-size: 11px; color: var(--text-muted); background: none; border: 1px solid var(--border-subtle); padding: 3px 8px; border-radius: 5px; cursor: pointer; }
    .copy-btn:hover { color: #fff; border-color: #fff; }
    pre { padding: 16px; overflow-x: auto; font-size: 13.5px; }

    /* Input Area */
    .input-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px; background: linear-gradient(transparent, var(--bg-base) 40%); pointer-events: none; }
    .input-box { max-width: var(--content-width); margin: 0 auto; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 10px 14px; display: flex; align-items: flex-end; gap: 12px; pointer-events: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5); transition: border-color 0.3s; }
    .input-box:focus-within { border-color: var(--accent); }
    
    textarea { flex: 1; background: none; border: none; color: #fff; font-family: inherit; font-size: 15px; resize: none; max-height: 200px; padding: 8px 0; outline: none; }
    .send-btn { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--accent); color: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
    .send-btn:disabled { background: var(--bg-elevated); color: var(--text-muted); cursor: not-allowed; }
    .send-btn.stop { background: var(--danger); }
  </style>
</head>
<body class="sidebar-open">

<div class="sidebar-overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <button class="new-btn" id="btn-new">＋ Nieuwe Chat</button>
  <div class="chat-list" id="chat-list"></div>
</aside>

<main class="main">
  <header class="header">
    <button id="menu-toggle" style="background:none; border:none; color:#fff; cursor:pointer;">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="status-group">
      <div id="dot" class="status-dot"></div>
      <span id="bal-text">INITIALISEREN...</span>
    </div>
  </header>

  <div class="chat-scroll" id="scroll-area">
    <div class="container" id="chat-box">
      </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="input" placeholder="Stel een vraag..." rows="1"></textarea>
      <button id="send-btn" class="send-btn">
        <svg id="svg-send" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg id="svg-stop" width="18" height="18" fill="currentColor" style="display:none"><rect width="18" height="18" rx="2"/></svg>
      </button>
    </div>
  </div>
</main>

<script>
  // --- GLOBALE STATE ---
  const CONFIG = { model: "openai", limit: 15 };
  let CHATS = [], CURRENT_ID = null, IS_BUSY = false, ai = null, db = null;
  let streamBuffer = "";

  const $ = id => document.getElementById(id);
  const UI = {
    input: $("input"), box: $("chat-box"), list: $("chat-list"), 
    btn: $("send-btn"), scroll: $("scroll-area"), dot: $("dot"), bal: $("bal-text")
  };

  // --- VEILIGE MARKDOWN ---
  const renderer = new marked.Renderer();
  renderer.code = function({text, lang}) {
    const validLang = lang || 'text';
    const highlighted = hljs.highlightAuto(text).value;
    return `<div class="code-wrapper">
      <div class="code-header"><span class="code-lang">${validLang}</span><button class="copy-btn" onclick="App.copy(this)">Copy</button></div>
      <pre><code class="hljs">${highlighted}</code></pre>
    </div>`;
  };
  marked.setOptions({ renderer, breaks: true });

  // --- DATABASE ---
  const DB = {
    init: () => new Promise(res => {
      const r = indexedDB.open("HyperRush_v2", 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore("chats", { keyPath: "id" });
      r.onsuccess = e => { db = e.target.result; res(); };
    }),
    save: () => {
      const t = db.transaction("chats", "readwrite").objectStore("chats");
      t.put({ id: "main", data: CHATS });
    },
    load: () => new Promise(res => {
      const t = db.transaction("chats", "readonly").objectStore("chats");
      const r = t.get("main");
      r.onsuccess = () => res(r.result ? r.result.data : []);
    })
  };

  // --- KERN LOGICA ---
  const App = {
    async init() {
      await DB.init();
      CHATS = await DB.load();
      
      let pk = localStorage.getItem("hr_pk");
      if (!pk) {
        pk = new URLSearchParams(location.hash.slice(1)).get("api_key");
        if (!pk) return location.href = `https://enter.pollinations.ai/authorize?redirect_url=${encodeURIComponent(location.href)}&app_key=pk_kn9KoGgYC7i5Sk6P`;
        localStorage.setItem("hr_pk", pk);
        location.hash = "";
      }

      ai = new AIClient({ apiKey: pk, model: CONFIG.model, stream: true });
      this.renderSidebar();
      this.updateBalance(pk);
      this.attachEvents();
      UI.bal.textContent = "KLAAR VOOR GEBRUIK";
    },

    attachEvents() {
      UI.btn.onclick = () => this.handleAction();
      $("btn-new").onclick = () => this.newChat();
      $("menu-toggle").onclick = () => document.body.classList.toggle("sidebar-open");
      $("overlay").onclick = () => document.body.classList.remove("sidebar-open");

      UI.input.oninput = () => {
        UI.input.style.height = 'auto';
        UI.input.style.height = UI.input.scrollHeight + 'px';
      };

      UI.input.onkeydown = e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); this.handleAction(); }
      };
    },

    async updateBalance(pk) {
      try {
        const r = await fetch("https://gen.pollinations.ai/account/balance", { headers: { Authorization: `Bearer ${pk}` } });
        const d = await r.json();
        UI.bal.textContent = `${Math.round(d.balance * 1000)} CREDITS`;
      } catch { UI.bal.textContent = "OFFLINE MODUS"; }
    },

    renderSidebar() {
      UI.list.innerHTML = "";
      CHATS.forEach(c => {
        const item = document.createElement("div");
        item.className = `chat-item ${c.id === CURRENT_ID ? 'active' : ''}`;
        item.innerHTML = `<span></span><button class="delete-btn">×</button>`;
        item.querySelector("span").textContent = c.title || "Nieuw gesprek";
        item.onclick = () => this.switchChat(c.id);
        item.querySelector(".delete-btn").onclick = (e) => { e.stopPropagation(); this.delChat(c.id); };
        UI.list.appendChild(item);
      });
    },

    renderMsg(role, rawContent) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${role}`;
      
      if (role === 'user') {
        const b = document.createElement("div");
        b.className = "bubble";
        b.textContent = rawContent;
        msgDiv.appendChild(b);
      } else {
        const body = document.createElement("div");
        body.className = "md-body";
        body.innerHTML = DOMPurify.sanitize(marked.parse(rawContent));
        msgDiv.appendChild(body);
      }
      
      UI.box.appendChild(msgDiv);
      UI.scroll.scrollTo({ top: UI.scroll.scrollHeight, behavior: 'smooth' });
      return msgDiv;
    },

    async handleAction() {
      if (IS_BUSY) { IS_BUSY = false; return; }
      
      const prompt = UI.input.value.trim();
      if (!prompt) return;

      if (!CURRENT_ID) {
        CURRENT_ID = Date.now().toString();
        CHATS.unshift({ id: CURRENT_ID, title: prompt.slice(0, 30), messages: [] });
      }

      const chat = CHATS.find(c => c.id === CURRENT_ID);
      chat.messages.push({ role: "user", content: prompt });
      this.renderMsg("user", prompt);
      
      UI.input.value = ""; UI.input.style.height = "auto";
      this.setLoading(true);

      streamBuffer = "";
      const aiMsgDiv = this.renderMsg("ai", "...");
      const target = aiMsgDiv.querySelector(".md-body");

      try {
        await ai.generate(prompt, {
          onStream: (chunk) => {
            if (!IS_BUSY) return;
            streamBuffer += chunk;
            target.innerHTML = DOMPurify.sanitize(marked.parse(streamBuffer));
            UI.scroll.scrollTop = UI.scroll.scrollHeight;
          }
        });
        chat.messages.push({ role: "assistant", content: streamBuffer });
        DB.save();
      } catch (err) {
        target.textContent = "Fout: " + err.message;
      } finally {
        this.setLoading(false);
        this.renderSidebar();
      }
    },

    setLoading(busy) {
      IS_BUSY = busy;
      UI.dot.className = busy ? "status-dot busy" : "status-dot";
      $("svg-send").style.display = busy ? "none" : "block";
      $("svg-stop").style.display = busy ? "block" : "none";
      UI.btn.classList.toggle("stop", busy);
    },

    switchChat(id) {
      if (IS_BUSY) return;
      CURRENT_ID = id;
      UI.box.innerHTML = "";
      ai.clearHistory();
      const chat = CHATS.find(c => c.id === id);
      chat.messages.forEach(m => {
        this.renderMsg(m.role, m.content);
        if (m.role !== "system") ai.addHistory?.(m.role, m.content);
      });
      this.renderSidebar();
      if (window.innerWidth < 1024) document.body.classList.remove("sidebar-open");
    },

    newChat() {
      CURRENT_ID = null;
      UI.box.innerHTML = `<div style="text-align:center; margin-top:100px; color:var(--text-muted)">
        <h2 style="color:#fff; margin-bottom:10px">HyperRush AI</h2>
        <p>Hoe kan ik je vandaag helpen?</p>
      </div>`;
      ai.clearHistory();
      this.renderSidebar();
    },

    delChat(id) {
      CHATS = CHATS.filter(c => c.id !== id);
      DB.save();
      if (CURRENT_ID === id) this.newChat(); else this.renderSidebar();
    },

    copy(btn) {
      const code = btn.closest(".code-wrapper").querySelector("code").innerText;
      navigator.clipboard.writeText(code);
      btn.textContent = "Gekopieerd!";
      setTimeout(() => btn.textContent = "Copy", 2000);
    }
  };

  App.init();
</script>
</body>
</html>
