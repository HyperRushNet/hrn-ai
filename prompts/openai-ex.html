<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperRush AI</title>
  <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/128/18548/18548385.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/HyperRushNet/hrn-ai/client/1.0.6.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg-base:#050505;--bg-surface:#0a0a0b;--bg-elevated:#141416;--border-subtle:hsla(0,0%,100%,0.1);--text-main:#f8fafc;--text-muted:#a1a1aa;--accent:#38bdf8;--danger:#ef4444;--sidebar-w:280px;--content-width:740px}
    ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:10px}
    *{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg-base);color:var(--text-main);font-family:Inter,sans-serif;height:100dvh;display:flex;overflow:hidden}
    .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;opacity:0;pointer-events:none;transition:opacity 0.2s}body.sidebar-open .sidebar-overlay{opacity:1;pointer-events:auto}
    .sidebar{width:var(--sidebar-w);background:var(--bg-surface);border-right:1px solid var(--border-subtle);padding:16px;position:fixed;height:100%;z-index:100;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column}
    @media(min-width:1024px){.sidebar{position:relative;transform:translateX(0)}.sidebar-overlay{display:none}}
    body.sidebar-open .sidebar{transform:translateX(0)}
    .new-btn{padding:12px;background:transparent;border:1px solid var(--border-subtle);border-radius:12px;color:var(--text-main);cursor:pointer;font-size:14px;width:100%;margin-bottom:16px;transition:all 0.2s;font-weight:500}.new-btn:hover{border-color:var(--accent);color:var(--accent)}
    .chat-list{flex:1;overflow-y:auto}.chat-item{padding:10px;border-radius:8px;font-size:13px;color:var(--text-muted);cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;transition:0.2s}.chat-item:hover{background:hsla(0,0%,100%,.05);color:var(--text-main)}.chat-item.active{background:rgba(56,189,248,0.1);color:var(--accent);border:1px solid rgba(56,189,248,0.2)}
    .delete-btn{background:none;border:none;color:#71717a;cursor:pointer;opacity:0;font-size:18px;transition:opacity 0.2s;padding:0 4px}.chat-item:hover .delete-btn{opacity:1}.delete-btn:hover{color:var(--danger)}
    .main{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}.header{height:54px;padding:0 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-subtle);background:rgba(5,5,5,0.8);backdrop-filter:blur(10px);z-index:10}
    .menu-btn{background:none;border:none;color:#fff;cursor:pointer;padding:5px;display:flex;align-items:center}@media(min-width:1024px){.menu-btn{display:none}}
    .status-indicator{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);font-family:'JetBrains Mono',monospace}.status-dot{width:8px;height:8px;border-radius:50%;background-color:var(--accent);animation:pulse 2s infinite}.status-dot.error{background-color:var(--danger);animation:none}.status-dot.inactive{background-color:var(--text-muted);animation:none}
    @keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.9)}100%{opacity:1;transform:scale(1)}}
    .chat-scroll{flex:1;overflow-y:auto;padding:24px 16px;scroll-padding-bottom:160px}.container{max-width:var(--content-width);margin:0 auto;width:100%;padding-bottom:120px}
    .msg{width:100%;margin-bottom:28px;display:flex;flex-direction:column;animation:fadeIn 0.3s ease}.msg.user{align-items:flex-end}.msg.ai{align-items:flex-start}
    .bubble{background:var(--bg-elevated);padding:12px 16px;border-radius:18px 18px 2px 18px;max-width:85%;font-size:14px;border:1px solid var(--border-subtle);line-height:1.5;white-space:pre-wrap;word-break:break-word}
    .typing-indicator{display:flex;gap:6px;padding:12px 16px;background:var(--bg-elevated);border-radius:16px;border:1px solid var(--border-subtle);margin-bottom:24px;width:max-content}.typing-indicator span{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:bounce 1.4s infinite ease-in-out}.typing-indicator span:nth-child(1){animation-delay:-0.32s}.typing-indicator span:nth-child(2){animation-delay:-0.16s}
    @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .md-body{font-size:15px;line-height:1.6;color:#e4e4e7;width:100%}.md-body p{margin-bottom:12px}.md-body strong{color:#fff}.md-body code{font-family:JetBrains Mono,monospace;background:hsla(0,0%,100%,.1);padding:.2em .4em;border-radius:4px;font-size:.9em}
    .code-wrapper{margin:16px 0;border:1px solid var(--border-subtle);border-radius:8px;overflow:hidden;background:#0d0d0f}.code-header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:hsla(0,0%,100%,.03);border-bottom:1px solid var(--border-subtle)}.code-lang{font-family:JetBrains Mono,monospace;font-size:11px;color:var(--accent);text-transform:uppercase;font-weight:600}
    .copy-code-btn{background:none;border:1px solid var(--border-subtle);color:var(--text-muted);padding:2px 8px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .2s}.copy-code-btn:hover{background:var(--accent);color:#000;border-color:var(--accent)}
    .md-body pre{margin:0;padding:14px;overflow-x:auto;background:transparent;border:none}.md-body pre code{font-size:13px;color:inherit;white-space:pre;display:block;font-family:JetBrains Mono,monospace;background:none;padding:0}
    .error-msg{color:var(--danger);background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);padding:12px 16px;border-radius:12px;font-size:14px}
    .input-wrap{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(transparent,#050505 80%);display:flex;justify-content:center;pointer-events:none}
    .input-box{width:100%;max-width:680px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:16px;display:flex;align-items:flex-end;padding:10px 12px;gap:10px;pointer-events:auto;transition:border 0.2s;min-height:54px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}.input-box:focus-within{border-color:var(--accent)}
    textarea{flex:1;background:transparent;border:none;color:#fff;font-family:inherit;font-size:15px;resize:none;outline:none;line-height:1.5;max-height:200px;padding:8px 4px;margin:0;overflow-y:auto}
    .send-btn{width:36px;height:36px;border-radius:10px;border:none;background:var(--border-subtle);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;margin-bottom:2px}.send-btn:hover{opacity:0.9}.send-btn.active{background:var(--accent)}.send-btn.active svg{stroke:#000}.send-btn.error{background:var(--danger)}
  </style>
</head>
<body>

<div class="sidebar-overlay" onclick="App.toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <button class="new-btn" onclick="App.newChat()">+ New Chat</button>
  <div class="chat-list" id="chat-list"></div>
</div>

<div class="main">
  <div class="header">
    <button class="menu-btn" onclick="App.toggleSidebar()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="status-indicator">
      <div id="status-dot" class="status-dot inactive"></div>
      <span id="balance">CONNECTING...</span>
    </div>
  </div>

  <div id="chat-view" class="chat-scroll"><div class="container" id="chat-container"></div></div>

  <div class="input-wrap">
    <div class="input-box">
      <textarea id="prompt" placeholder="Ask anything..." rows="1"></textarea>
      <button id="send-btn" class="send-btn" onclick="App.handleSendOrStop()">
        <svg id="icon-send" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg id="icon-stop" width="18" height="18" viewBox="0 0 24 24" fill="black" style="display:none"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  // --- CONFIGURATIE OP BASIS VAN DOCS ---
  const CONFIG = {
    model: "openai",
    systemPrompt: "You are HyperRush AI, a helpful and concise assistant.",
    historyLimit: 10,
    stream: true
  };

  const DB_NAME = "HyperRushDB", DB_STORE = "chatHistory";
  let CURRENT_ID = null, CHATS = [], PK = localStorage.getItem("pk");
  let isGenerating = false, db = null, ai = null, rafId = null, streamText = "";

  const $ = id => document.getElementById(id);
  const promptEl = $("prompt"), chatContainerEl = $("chat-container"), sendBtn = $("send-btn");
  const iconSend = $("icon-send"), iconStop = $("icon-stop"), chatListEl = $("chat-list");
  const chatViewEl = $("chat-view"), balanceEl = $("balance"), statusDot = $("status-dot");

  // Marked Renderer (Docs support)
  const renderer = new marked.Renderer();
  renderer.code = function(token) {
    const codeText = token.text || '';
    const lang = token.lang || 'plaintext';
    let highlighted = codeText;
    try { highlighted = hljs.highlight(codeText, { language: lang, ignoreIllegals: true }).value; } catch (e) {}
    return `<div class="code-wrapper"><div class="code-header"><span class="code-lang">${lang}</span><button class="copy-code-btn" onclick="App.copyCode(this)">Copy</button></div><pre><code class="hljs">${highlighted}</code></pre></div>`;
  };
  marked.setOptions({ renderer, breaks: true });

  // DB Handlers
  const _initDB = () => new Promise(res => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE, { keyPath: "id" });
    r.onsuccess = e => { db = e.target.result; res(); };
  });

  const _dbOp = (mode, op) => new Promise((res) => {
    if (!db) return res([]);
    const t = db.transaction(DB_STORE, mode).objectStore(DB_STORE);
    const req = op(t);
    req.onsuccess = () => res(req.result);
  });

  const saveDB = () => _dbOp("readwrite", s => s.put({ id: "main", chats: CHATS }));
  const loadDB = () => _dbOp("readonly", s => s.get("main")).then(d => d ? d.chats : []);

  async function init() {
    await _initDB();
    CHATS = await loadDB();
    
    if (!PK) {
      const key = new URLSearchParams(location.hash.slice(1)).get("api_key");
      if (!key) return location.href = `https://enter.pollinations.ai/authorize?redirect_url=${encodeURIComponent(location.href)}&permissions=profile,balance,usage,offline_access&app_key=pk_kn9KoGgYC7i5Sk6P&expiry=never`;
      localStorage.setItem("pk", key); PK = key; location.hash = "";
    }
    
    // AIClient initialisatie volgens de Constructor Options tabel
    ai = new AIClient({ 
      apiKey: PK, 
      model: CONFIG.model, 
      systemPrompt: CONFIG.systemPrompt,
      historyLimit: CONFIG.historyLimit,
      stream: CONFIG.stream,
      retry: true
    });
    
    renderSidebar();
    updateBalance();
    
    promptEl.addEventListener("input", () => {
      promptEl.style.height = "auto";
      promptEl.style.height = promptEl.scrollHeight + "px";
    });

    promptEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSendOrStop(); }
    });
    
    setStatus("ready");
  }

  function setStatus(s) {
    statusDot.className = "status-dot " + (s === "error" ? "error" : s === "generating" ? "" : "ready");
    sendBtn.className = "send-btn " + (s === "generating" ? "active" : s === "error" ? "error" : "");
    iconSend.style.display = s === "generating" ? "none" : "block";
    iconStop.style.display = s === "generating" ? "block" : "none";
  }

  async function updateBalance() {
    try {
      const r = await fetch("https://gen.pollinations.ai/account/balance", { headers: { Authorization: "Bearer " + PK } });
      const data = await r.json();
      balanceEl.innerText = r.status === 402 ? "LIMIT REACHED" : Math.round(data.balance * 1000) + " CR";
    } catch { balanceEl.innerText = "ERROR"; }
  }

  function renderSidebar() {
    chatListEl.innerHTML = "";
    CHATS.forEach(c => {
      const el = document.createElement("div");
      el.className = "chat-item" + (c.id === CURRENT_ID ? " active" : "");
      el.innerHTML = `<span>${c.title}</span><button class="delete-btn">×</button>`;
      el.querySelector(".delete-btn").onclick = e => { e.stopPropagation(); deleteChat(c.id); };
      el.onclick = () => loadChat(c.id);
      chatListEl.appendChild(el);
    });
  }

  const loadChat = id => {
    if (isGenerating) return;
    CURRENT_ID = id;
    const chat = CHATS.find(c => c.id === id);
    chatContainerEl.innerHTML = "";
    ai.clearHistory();
    chat.messages.forEach(m => {
      renderMsg(m.role, m.content);
      // History handmatig vullen om context te behouden bij laden
      if (m.role !== "system") ai.addHistory?.(m.role, m.content);
    });
    renderSidebar();
    if (innerWidth < 1024) document.body.classList.remove("sidebar-open");
    setTimeout(scrollToBottom, 50);
  };

  const newChat = () => {
    if (isGenerating) return;
    CURRENT_ID = null;
    chatContainerEl.innerHTML = "";
    ai.clearHistory();
    renderSidebar();
    setStatus("ready");
  };

  const deleteChat = async id => {
    CHATS = CHATS.filter(c => c.id !== id);
    await saveDB();
    if (CURRENT_ID === id) newChat(); else renderSidebar();
  };

  const scrollToBottom = () => chatViewEl.scrollTo({ top: chatViewEl.scrollHeight, behavior: "smooth" });

  function renderMsg(role, content, isError = false) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    if (role === "user") {
      div.innerHTML = `<div class="bubble">${content}</div>`;
    } else if (isError) {
      div.innerHTML = `<div class="error-msg">${content}</div>`;
    } else {
      const body = document.createElement("div");
      body.className = "md-body";
      body.innerHTML = marked.parse(content || "");
      div.appendChild(body);
    }
    chatContainerEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  async function handleSendOrStop() {
    if (isGenerating) { isGenerating = false; setStatus("ready"); return; }
    
    const text = promptEl.value.trim();
    if (!text) return;
    promptEl.value = ""; promptEl.style.height = "auto";
    
    if (!CURRENT_ID) {
      CURRENT_ID = Date.now().toString();
      CHATS.unshift({ id: CURRENT_ID, title: text.substring(0, 24) + "...", messages: [] });
    }
    
    const chat = CHATS.find(c => c.id === CURRENT_ID);
    chat.messages.push({ role: "user", content: text });
    renderMsg("user", text);
    
    isGenerating = true; setStatus("generating");
    streamText = "";

    const ti = document.createElement("div");
    ti.id = "ti-box"; ti.className = "msg ai";
    ti.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
    chatContainerEl.appendChild(ti);
    scrollToBottom();
    
    try {
      // Gebruik van de .generate method volgens de Method Chaining & Signature docs
      await ai.generate(text, {
        onStream: chunk => {
          if (!isGenerating) return;
          if ($("ti-box")) {
            $("ti-box").remove();
            const msgBox = renderMsg("ai", "");
            msgBox.querySelector(".md-body").id = "stream-target";
          }
          streamText += chunk;
          if (!rafId) {
            rafId = requestAnimationFrame(() => {
              const target = $("stream-target");
              if (target) { target.innerHTML = marked.parse(streamText); scrollToBottom(); }
              rafId = null;
            });
          }
        }
      });
      
      chat.messages.push({ role: "assistant", content: streamText });
      await saveDB();
      updateBalance();
      if ($("stream-target")) $("stream-target").removeAttribute("id");
    } catch (err) {
      if ($("ti-box")) $("ti-box").remove();
      // Error handling op basis van de Error Types tabel
      const errMsg = err.message.includes("401") ? "Invalid API Key" : err.message;
      renderMsg("ai", `Error: ${errMsg}`, true);
      setStatus("error");
    } finally {
      isGenerating = false; setStatus("ready"); renderSidebar();
    }
  }

  const App = {
    init,
    toggleSidebar: () => document.body.classList.toggle("sidebar-open"),
    newChat,
    handleSendOrStop,
    copyCode: btn => {
      const code = btn.closest(".code-wrapper").querySelector("code").innerText;
      navigator.clipboard.writeText(code);
      const old = btn.innerText; btn.innerText = "Copied!";
      setTimeout(() => btn.innerText = old, 1500);
    }
  };

  App.init();
</script>
</body>
</html>
