<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://cdn-icons-png.flaticon.com data:; connect-src 'self' https://gen.pollinations.ai https://enter.pollinations.ai https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;">
  
  <title>HyperRush | Perplexity Pro</title>
  <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/128/18548/18548385.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/HyperRushNet/hrn-ai/client/1.0.6.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #050505; --bg-surface: #0a0a0b; --bg-elevated: #141416;
      --border-subtle: hsla(0,0%,100%,0.08); --text-main: #f8fafc;
      --text-muted: #a1a1aa; --accent: #38bdf8; --danger: #ef4444;
      --sidebar-w: 280px; --content-width: 760px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-base); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100dvh; display: flex; overflow: hidden; }

    .sidebar { width: var(--sidebar-w); background: var(--bg-surface); border-right: 1px solid var(--border-subtle); padding: 16px; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 100; }
    @media (max-width: 1024px) { .sidebar { position: fixed; height: 100%; transform: translateX(-100%); } body.sidebar-open .sidebar { transform: translateX(0); } }
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 90; opacity: 0; pointer-events: none; transition: 0.3s; }
    body.sidebar-open .sidebar-overlay { opacity: 1; pointer-events: auto; }

    .new-btn { padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); border-radius: 12px; color: #fff; cursor: pointer; font-weight: 600; margin-bottom: 20px; text-align: left; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 10px 12px; border-radius: 10px; font-size: 13.5px; color: var(--text-muted); cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .chat-item.active { background: rgba(56,189,248,0.1); border-color: rgba(56,189,248,0.2); color: var(--accent); border: 1px solid rgba(56,189,248,0.2); }
    .delete-btn { background: none; border: none; color: #71717a; font-size: 18px; cursor: pointer; padding: 0 5px; }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    .header { height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); background: rgba(5,5,5,0.7); backdrop-filter: blur(12px); z-index: 50; }
    
    .status-group { display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .status-dot.busy { background: var(--accent); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .chat-scroll { flex: 1; overflow-y: auto; padding: 20px; }
    .container { max-width: var(--content-width); margin: 0 auto; padding-bottom: 120px; }
    
    .msg { margin-bottom: 30px; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .msg.user { display: flex; justify-content: flex-end; }
    .msg.user .bubble { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 18px 18px 4px 18px; padding: 12px 18px; max-width: 85%; color: #fff; line-height: 1.5; }

    .cite-tag {
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(56,189,248,0.15); color: var(--accent);
      border: 1px solid rgba(56,189,248,0.3); border-radius: 4px;
      font-size: 10px; font-weight: 700; width: 17px; height: 17px;
      margin: 0 3px; vertical-align: middle; cursor: help;
    }

    .code-wrapper { margin: 16px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-subtle); background: #011627; }
    .code-header { background: rgba(255,255,255,0.03); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; }
    .copy-btn { font-size: 11px; color: var(--text-muted); background: none; border: 1px solid var(--border-subtle); padding: 2px 8px; border-radius: 4px; cursor: pointer; }

    .input-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px; background: linear-gradient(transparent, var(--bg-base) 60%); pointer-events: none; }
    .input-box { max-width: var(--content-width); margin: 0 auto; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 10px 14px; display: flex; align-items: flex-end; gap: 12px; pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    textarea { flex: 1; background: none; border: none; color: #fff; font-size: 15px; resize: none; max-height: 180px; padding: 8px 0; outline: none; line-height: 1.5; }
    .send-btn { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--accent); color: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
    .send-btn.stop { background: var(--danger); color: #fff; }
  </style>
</head>
<body class="sidebar-open">

<div class="sidebar-overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <button class="new-btn" id="btn-new">＋ Nieuwe Chat</button>
  <div class="chat-list" id="chat-list"></div>
</aside>

<main class="main">
  <header class="header">
    <button id="menu-toggle" style="background:none; border:none; color:#fff; cursor:pointer;">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="status-group">
      <div id="dot" class="status-dot"></div>
      <span id="bal-text">PXP-FAST ACTIEF</span>
    </div>
  </header>

  <div class="chat-scroll" id="scroll-area">
    <div class="container" id="chat-box"></div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="input" placeholder="Vraag Perplexity..." rows="1"></textarea>
      <button id="send-btn" class="send-btn">
        <svg id="svg-send" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg id="svg-stop" width="18" height="18" fill="currentColor" style="display:none"><rect width="18" height="18" rx="2"/></svg>
      </button>
    </div>
  </div>
</main>

<script>
  // Alles in één object om globale vervuiling te voorkomen
  const App = {
    config: { model: "perplexity-fast" },
    state: { chats: [], currentId: null, isBusy: false, streamText: "" },
    
    async init() {
      // 1. Database & History
      await this.initDB();
      
      // 2. Auth Check
      let pk = localStorage.getItem("hr_pk");
      if (!pk) {
        pk = new URLSearchParams(location.hash.slice(1)).get("api_key");
        if (!pk) return location.href = `https://enter.pollinations.ai/authorize?redirect_url=${encodeURIComponent(location.href)}&app_key=pk_kn9KoGgYC7i5Sk6P`;
        localStorage.setItem("hr_pk", pk);
        location.hash = "";
      }

      // 3. AI Setup
      this.ai = new AIClient({ apiKey: pk, model: this.config.model, stream: true });
      
      // 4. UI Bindings
      this.bindEvents();
      this.renderSidebar();
      this.newChat();
    },

    async initDB() {
      return new Promise(res => {
        const req = indexedDB.open("HyperRush_Final", 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore("chats", { keyPath: "id" });
        req.onsuccess = e => {
          this.db = e.target.result;
          const t = this.db.transaction("chats", "readonly").objectStore("chats").get("main");
          t.onsuccess = () => { 
            this.state.chats = t.result ? t.result.data : [];
            res();
          };
        };
      });
    },

    bindEvents() {
      document.getElementById("send-btn").onclick = () => this.handleAction();
      document.getElementById("btn-new").onclick = () => this.newChat();
      document.getElementById("menu-toggle").onclick = () => document.body.classList.toggle("sidebar-open");
      document.getElementById("overlay").onclick = () => document.body.classList.remove("sidebar-open");
      
      const input = document.getElementById("input");
      input.oninput = () => {
        input.style.height = 'auto';
        input.style.height = input.scrollHeight + 'px';
      };
      input.onkeydown = e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); this.handleAction(); }
      };
    },

    parse(text) {
      // Verwerk citaten [1], [2] naar badges
      const cited = text.replace(/\[(\d+)\]/g, '<span class="cite-tag">$1</span>');
      return DOMPurify.sanitize(marked.parse(cited));
    },

    renderMsg(role, content) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      const inner = document.createElement("div");
      
      if (role === 'user') {
        inner.className = "bubble";
        inner.textContent = content;
      } else {
        inner.className = "md-body";
        inner.innerHTML = this.parse(content);
      }
      
      div.appendChild(inner);
      box.appendChild(div);
      this.scroll();
      return div;
    },

    async handleAction() {
      if (this.state.isBusy) { this.state.isBusy = false; return; }
      
      const input = document.getElementById("input");
      const prompt = input.value.trim();
      if (!prompt) return;

      if (!this.state.currentId) {
        this.state.currentId = Date.now().toString();
        this.state.chats.unshift({ id: this.state.currentId, title: prompt.slice(0, 30), messages: [] });
      }

      const chat = this.state.chats.find(c => c.id === this.state.currentId);
      chat.messages.push({ role: "user", content: prompt });
      this.renderMsg("user", prompt);
      
      input.value = ""; input.style.height = "auto";
      this.setLoading(true);

      this.state.streamText = "";
      const aiDiv = this.renderMsg("ai", "...");
      const target = aiDiv.querySelector(".md-body");

      try {
        await this.ai.generate(prompt, {
          onStream: (chunk) => {
            if (!this.state.isBusy) return;
            this.state.streamText += chunk;
            target.innerHTML = this.parse(this.state.streamText);
            this.scroll();
          }
        });
        chat.messages.push({ role: "assistant", content: this.state.streamText });
        this.save();
      } catch (err) {
        target.textContent = "Verbinding onderbroken. Probeer het opnieuw.";
      } finally {
        this.setLoading(false);
        this.renderSidebar();
      }
    },

    setLoading(busy) {
      this.state.isBusy = busy;
      document.getElementById("dot").classList.toggle("busy", busy);
      document.getElementById("svg-send").style.display = busy ? "none" : "block";
      document.getElementById("svg-stop").style.display = busy ? "block" : "none";
      document.getElementById("send-btn").classList.toggle("stop", busy);
    },

    scroll() {
      const s = document.getElementById("scroll-area");
      s.scrollTo({ top: s.scrollHeight, behavior: 'smooth' });
    },

    save() {
      const t = this.db.transaction("chats", "readwrite").objectStore("chats");
      t.put({ id: "main", data: this.state.chats });
    },

    renderSidebar() {
      const list = document.getElementById("chat-list");
      list.innerHTML = "";
      this.state.chats.forEach(c => {
        const div = document.createElement("div");
        div.className = `chat-item ${c.id === this.state.currentId ? 'active' : ''}`;
        div.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${DOMPurify.sanitize(c.title)}</span><button class="delete-btn">×</button>`;
        div.onclick = () => this.switchChat(c.id);
        div.querySelector(".delete-btn").onclick = e => { e.stopPropagation(); this.delChat(c.id); };
        list.appendChild(div);
      });
    },

    switchChat(id) {
      if (this.state.isBusy) return;
      this.state.currentId = id;
      document.getElementById("chat-box").innerHTML = "";
      this.ai.clearHistory();
      const chat = this.state.chats.find(c => c.id === id);
      chat.messages.forEach(m => {
        this.renderMsg(m.role, m.content);
        if (m.role !== "system") this.ai.addHistory?.(m.role, m.content);
      });
      this.renderSidebar();
      if (window.innerWidth < 1024) document.body.classList.remove("sidebar-open");
    },

    newChat() {
      this.state.currentId = null;
      document.getElementById("chat-box").innerHTML = '<div style="margin-top:20vh;text-align:center;color:var(--text-muted)"><h3>HyperRush Perplexity</h3><p>Wat wil je vandaag onderzoeken?</p></div>';
      this.ai.clearHistory();
      this.renderSidebar();
    },

    delChat(id) {
      this.state.chats = this.state.chats.filter(c => c.id !== id);
      this.save();
      if (this.state.currentId === id) this.newChat(); else this.renderSidebar();
    },

    copy(btn) {
      const code = btn.closest(".code-wrapper").querySelector("code").innerText;
      navigator.clipboard.writeText(code);
      btn.textContent = "Gekopieerd!";
      setTimeout(() => btn.textContent = "Copy", 2000);
    }
  };

  // Start de app
  window.onload = () => App.init();
</script>
</body>
</html>
