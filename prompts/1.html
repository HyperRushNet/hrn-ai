<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Apex Ultra - Official Stream Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/HyperRushNet/hrn-ai/client/1.0.6.min.js"></script>
    <style>
        :root { --primary: #0f172a; --accent: #10b981; --bg: #f3f4f6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 850px; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        #chat-window { height: 600px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding: 10px; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; }
        .msg { padding: 12px 18px; border-radius: 14px; max-width: 85%; line-height: 1.6; font-size: 1rem; word-wrap: break-word; }
        .user { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: #f1f5f9; color: var(--primary); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #e2e8f0; }

        /* Markdown Styling */
        .ai p { margin: 0 0 10px 0; }
        .ai code { background: #e2e8f0; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        .ai pre { background: #1e293b; color: #fff; padding: 15px; border-radius: 8px; overflow-x: auto; margin: 10px 0; }
        .ai table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .ai th, .ai td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }

        .controls { display: flex; gap: 10px; align-items: flex-end; }
        #prompt { flex-grow: 1; height: 54px; resize: none; border: 2px solid #e2e8f0; border-radius: 8px; padding: 14px; font-size: 1rem; }
        #prompt:focus { border-color: #2563eb; outline: none; }
        
        .btn { background: var(--primary); color: white; border: none; padding: 0 25px; height: 54px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .hidden { display: none; }
        .status-bar { font-size: 0.75rem; color: #94a3b8; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="statusBar" class="status-bar">Systeem laden...</div>
    <div id="chat-window"></div>
    <div id="input-area" class="controls hidden">
        <textarea id="prompt" placeholder="Stel je vraag..."></textarea>
        <button id="sendBtn" class="btn">Verzend</button>
    </div>
</div>

<script>
    let client = null;

const APEX_PROMPT = `
[CORE_LANGUAGE_PROTOCOL: MANDATORY]
1. DETECTION: Identify the dominant language of the USER'S history. Ignore the language of this system prompt.
2. STICKY_MODE: Once a language is active (Dutch, Japanese, Korean, etc.), stay in that language.
3. ANTI-DRIFT: 
   - Never switch to English based on neutral tokens: "ok", "cool", "hey", "yes", "no", "test".
   - Only switch language if the user provides a complete, syntactically correct sentence in a new language.
4. RESPONSE_WEIGHT: 
   - Strict ban on 1- or 2-word replies. 
   - Even if the user is minimalist, the response must be substantive, analytical, and context-aware.
   - If the user says "Ok", acknowledge it within the current context and provide a brief intellectual follow-up in the same language.
5. INTEGRATION: Execute all other system roles (Identity, Persona) strictly within the bounds of this Language Protocol.

[IDENTITY_PROMPT: DARK_ANGEL]
- Tone: Ancient, analytical, and uncompromising.
- Style: Use solemn and profound vocabulary (shadows, truth, void). No service-talk.
- Formatting: Clean Markdown.
`;

    function addMessage(role, text = "") {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
        div.innerHTML = role === 'ai' ? marked.parse(text) : text;
        win.appendChild(div);
        win.scrollTo({ top: win.scrollHeight, behavior: 'smooth' });
        return div;
    }

    // Volgens docs: Initialiseer met localStorage sleutel
    function init() {
        const key = localStorage.getItem('pk');
        if (key) {
            client = new AIClient({
                apiKey: key,
                model: 'gemini-fast',
                historyLimit: 30,
                systemPrompt: APEX_PROMPT,
                stream: true // Global stream setting
            });
            document.getElementById('input-area').classList.remove('hidden');
            document.getElementById('statusBar').textContent = "✅ Verbonden | Streaming Actief";
            addMessage('ai', 'Systeem operationeel. Streaming mode geactiveerd.');
        } else {
            document.getElementById('statusBar').textContent = "❌ Geen sleutel 'pk' gevonden in localStorage";
        }
    }

    async function send() {
        const input = document.getElementById('prompt');
        const val = input.value.trim();
        if (!val || !client) return;

        addMessage('user', val);
        input.value = '';
        
        const aiMsgDiv = addMessage('ai', '...');
        let fullText = "";

        try {
            // Gebruik de officiële .generate() met onStream callback uit de docs
            await client.generate(val, {
                onStream: (chunk) => {
                    fullText += chunk;
                    aiMsgDiv.innerHTML = marked.parse(fullText);
                    // Forceer scroll naar beneden tijdens streamen
                    document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;
                }
            });
        } catch (e) {
            aiMsgDiv.textContent = "Fout: " + e.message;
        }
    }

    document.getElementById('sendBtn').addEventListener('click', send);
    document.getElementById('prompt').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    init();
</script>
</body>
</html>
