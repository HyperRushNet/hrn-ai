<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Angel - Universal Syntax & Perfect Spacing</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  
  <style>
    :root {
      --bg-base: #050505;
      --bg-surface: #0a0a0b;
      --border-subtle: rgba(255,255,255,0.08);
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --text-task-open: #f1f5f9;
      --accent: #38bdf8;
      --link-color: #a1cdf0; 
      --gap-block: 24px; /* Consistente spacing tussen grote blokken */
      --gap-item: 12px;  /* Spacing tussen lijstitems */
      --content-width: 800px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-base); color: var(--text-main); font-family: 'Inter', sans-serif; min-height: 100vh; line-height: 1.6; }
    
    .chat-scroll { padding: 60px 24px; display: flex; justify-content: center; }
    .container { max-width: var(--content-width); width: 100%; }
    
    /* --- TYPOGRAFIE & SPACING --- */
    .md-body > * + * { margin-top: var(--gap-block); } /* Smart spacing: alleen tussen elementen */
    
    .md-body h1 { font-size: 2.25rem; font-weight: 600; letter-spacing: -0.025em; margin-bottom: 32px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px; }
    .md-body h2 { font-size: 1.5rem; margin-top: 48px; margin-bottom: 16px; color: #fff; }
    .md-body p { margin-bottom: 0; }

    /* --- LINKS --- */
    .md-body a { color: var(--link-color); text-decoration: none; border-bottom: 1px solid rgba(161, 205, 240, 0.3); transition: 0.2s; }
    .md-body a:hover { color: #fff; border-bottom-color: #fff; background: rgba(161, 205, 240, 0.05); }

    /* --- LIJSTEN --- */
    .md-body ul, .md-body ol { list-style: none; }
    .md-body li { position: relative; margin-top: var(--gap-item); }
    .md-body li:first-child { margin-top: 0; }
    
    .md-body ul li:not(.task-list-item) { padding-left: 28px; }
    .md-body ul li:not(.task-list-item)::before {
      content: ""; position: absolute; left: 4px; top: 11px; width: 12px; height: 2px; background: var(--accent); border-radius: 2px;
    }
    
    .md-body ol { counter-reset: section; }
    .md-body ol > li { padding-left: 32px; counter-increment: section; }
    .md-body ol > li::before {
      content: counter(section) "."; position: absolute; left: 0; color: var(--accent); font-family: 'JetBrains Mono'; font-weight: 600; font-size: 0.9em;
    }

    /* --- TASKS --- */
    .task-list-item { display: flex; align-items: flex-start; gap: 14px; }
    .task-list-item input {
      appearance: none; width: 18px; height: 18px; border: 1.5px solid rgba(255,255,255,0.3); 
      border-radius: 5px; cursor: pointer; position: relative; background: rgba(255,255,255,0.03); margin-top: 4px; flex-shrink: 0;
    }
    .task-list-item input:checked { background: var(--accent); border-color: var(--accent); }
    .task-list-item input:checked::after {
      content: ''; position: absolute; left: 5px; top: 2px; width: 5px; height: 9px;
      border: solid #000; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
    }
    .task-list-item input:checked + span { color: var(--text-muted); text-decoration: line-through; }

    /* --- CODE BLOCKS --- */
    .code-block { border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--bg-surface); overflow: hidden; margin: 32px 0; }
    .code-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border-subtle); }
    .code-lang { font-size: 11px; color: var(--accent); font-family: 'JetBrains Mono'; text-transform: uppercase; font-weight: 600; }
    .copy-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; transition: 0.2s; }
    .copy-btn:hover { color: var(--accent); }
    .copy-btn svg { width: 16px; height: 16px; fill: currentColor; }

    .md-body pre { padding: 24px !important; margin: 0 !important; background: transparent !important; }
    code[class*="language-"] { font-family: 'JetBrains Mono', monospace; font-size: 14px; tab-size: 4; }

    /* --- BLOCKQUOTE --- */
    .md-body blockquote {
      padding: 12px 24px; border-left: 4px solid var(--accent);
      background: rgba(56,189,248,0.03); color: #cbd5e1; font-style: italic; border-radius: 0 8px 8px 0;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</head>
<body>

<div class="main">
  <div class="chat-scroll">
    <div class="container" id="content"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const contentEl = document.getElementById('content');

  // Stress Test met diverse talen voor de Autoloader
  const markdown = "# 🌌 Universal Parser\n\n" +
    "Check deze [blauwe link](#) en de verbeterde spacing. De autoloader regelt de syntax.\n\n" +
    "## Rust Example\n" +
    "```rust\n" +
    "fn main() {\n" +
    "    println!(\"Hello World from Rust!\");\n" +
    "}\n" +
    "```\n\n" +
    "## SQL Example\n" +
    "```sql\n" +
    "SELECT id, name FROM users WHERE status = 'active' ORDER BY created_at DESC;\n" +
    "```\n\n" +
    "### Spacing & Checklist\n" +
    "- [ ] Merk op hoe de afstand tussen items gelijk is.\n" +
    "- [x] Alles is strak uitgelijnd op 12px en 24px grids.\n" +
    "  - Genest item test.\n\n" +
    "> \"Consistentie is de sleutel tot een premium UI.\"\n";

  const renderer = new marked.Renderer();
  renderer.listitem = function(token) {
    let content = this.parser.parse(token.tokens);
    if (token.task) {
      const checked = token.checked ? 'checked' : '';
      return `<li class="task-list-item"><input type="checkbox" ${checked} disabled> <span>${content}</span></li>`;
    }
    return `<li>${content}</li>`;
  };

  contentEl.innerHTML = '<div class="md-body">' + marked.parse(markdown, { renderer: renderer }) + '</div>';

  // UI Wrapping & Copy Logic
  document.querySelectorAll('.md-body pre').forEach((pre) => {
    const codeEl = pre.querySelector('code');
    const lang = (codeEl.className.match(/language-(\w+)/) || [, 'code'])[1];
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block';
    const header = document.createElement('div');
    header.className = 'code-header';
    
    const copyIcon = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
    const checkIcon = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';

    header.innerHTML = `<span class="code-lang">${lang}</span><button class="copy-btn">${copyIcon}</button>`;
    
    const btn = header.querySelector('.copy-btn');
    btn.onclick = () => {
      navigator.clipboard.writeText(codeEl.innerText);
      btn.innerHTML = checkIcon;
      setTimeout(() => btn.innerHTML = copyIcon, 2000);
    };

    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);
  });

  // Autoloader configuratie en trigger
  Prism.plugins.autoloader.languages_path = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/';
  Prism.highlightAll();
});
</script>
</body>
</html>
