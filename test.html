<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Angel - Omega Parser V3.1</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  
  <style>
    :root {
      --bg: #050505;
      --surface: #0a0a0b;
      --border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #64748b;
      --accent: #38bdf8;
      --radius: 12px;
      --fs-base: 14px;
      --fs-code: 13px;
      --header-h: 36px;
    }

    /* --- GLOBAL --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: var(--bg); color: var(--text); 
      font-family: 'Inter', sans-serif; font-size: var(--fs-base);
      line-height: 1.6; -webkit-font-smoothing: antialiased; 
    }
    .chat-scroll { padding: 40px 20px; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; }

    /* --- CONTENT CORE --- */
    .md-body > * { margin-bottom: 20px; }
    h1, h2, h3 { color: #fff; font-weight: 600; margin-top: 32px; }
    p { color: #cbd5e1; }
    
    /* Blockquote Stress Fix */
    blockquote { 
      border-left: 3px solid var(--accent); 
      background: rgba(56,189,248,0.03); 
      padding: 12px 20px; 
      margin: 20px 0; 
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    blockquote p { font-style: italic; margin-bottom: 0; }

    /* List Stress Fix */
    ul, ol { padding-left: 24px; margin: 16px 0; }
    li { margin-bottom: 8px; }

    /* --- MATH & CODE (ZERO SHIFT) --- */
    .katex { font-size: 1.05em !important; }
    .katex-display { margin: 1.5em 0 !important; overflow-x: auto; overflow-y: hidden; }

    .code-block { 
      border: 1px solid var(--border); border-radius: var(--radius); 
      background: var(--surface); margin: 20px 0; overflow: hidden;
      display: flex; flex-direction: column; contain: content;
    }
    .code-header { 
      display: flex; justify-content: space-between; align-items: center; 
      height: var(--header-h); padding: 0 14px; 
      background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); 
    }
    .code-lang { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono'; font-weight: 700; text-transform: uppercase; }
    
    .copy-btn {
      background: transparent; border: none; color: var(--muted); cursor: pointer;
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      transition: color 0.2s;
    }
    .copy-btn:hover { color: var(--accent); }
    .copy-btn svg { width: 14px; height: 14px; stroke-width: 2.5; }

    .md-body pre { padding: 16px !important; margin: 0 !important; background: transparent !important; overflow-x: auto; }
    code { font-family: 'JetBrains Mono', monospace; font-size: var(--fs-code) !important; }
    :not(pre) > code { 
      background: rgba(255,255,255,0.06); padding: 2px 5px; 
      border-radius: 4px; color: var(--accent); font-size: 0.92em !important; 
    }

    /* --- TABLE OMEGA --- */
    .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); margin: 24px 0; }
    table { width: 100%; border-collapse: collapse; font-size: var(--fs-code); min-width: 500px; }
    th { background: rgba(255,255,255,0.02); color: var(--accent); padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: #94a3b8; }
    tr:last-child td { border-bottom: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</head>
<body>

<div class="chat-scroll">
  <div class="container" id="content"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const contentEl = document.getElementById('content');

  const omegaMD = `# 🛡️ Omega Stress Test V3.1

### 1. Math-in-Heading: $\\oint_C \\vec{B} \\cdot d\\vec{l} = \\mu_0 I_{encl}$
Dit test of headers hun grootte behouden wanneer KaTeX ze overneemt.

### 2. Deep Nesting & Lists
> "Citaat met een lijst erin:"
> * Punt A met inline code \`var x = 10\`
> * Punt B met inline math $\\alpha + \\beta = \\gamma$
> * Een geneste lijst:
>   1. Sub-item met $\\sqrt{2}$
>   2. Sub-item met \`sudo rm -rf\`

### 3. The Table Boss
| Feature | Complex Equation | Code Snippet | Status |
|:--- |:--- |:--- |:--- |
| **Physics** | $P = \\frac{W}{\\Delta t}$ | \`power()\` | ✅ |
| **Matrix** | $\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}$ | \`new Matrix()\` | 🚀 |
| **Overflow** | $x_{1,2} = \\frac{-b \\pm \\sqrt{b^2-4ac}}{2a}$ | \`LONG_STRING_CONSTANT_TEST_001\` | 🛠️ |

### 4. Code Security (HTML Injection)
\`\`\`html
<div class="fake-ui">
  <script>alert('Dit mag niet uitgevoerd worden!');<\/script>
  <p>Dit moet gewoon als tekst zichtbaar zijn.</p>
</div>
\`\`\`

### 5. Inline Density Test
Test: $a$ plus $b$ is $c$, en $\\pi$ is ongeveer $3.14$. Werkt $\\theta$? Ja. En $\\int f(x)dx$? Ook. \`Inline Code\` naast $Math$. Perfect.`;

  // --- RENDERING PIPELINE ---
  
  // 1. Markdown
  contentEl.innerHTML = '<div class="md-body">' + marked.parse(omegaMD) + '</div>';

  // 2. KaTeX
  renderMathInElement(contentEl, { 
    delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}],
    throwOnError: false 
  });

  // 3. UI Enhancement (CodeBlocks & Tables)
  const iconCopy = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
  const iconCheck = `<svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

  document.querySelectorAll('.md-body pre').forEach((pre) => {
    if (pre.parentElement.classList.contains('code-block')) return;
    const codeEl = pre.querySelector('code');
    const lang = (codeEl.className.match(/language-(\w+)/) || [, 'code'])[1];
    
    const wrap = document.createElement('div'); wrap.className = 'code-block';
    const head = document.createElement('div'); head.className = 'code-header';
    const label = document.createElement('span'); label.className = 'code-lang'; label.innerText = lang;
    const btn = document.createElement('button'); btn.className = 'copy-btn'; btn.innerHTML = iconCopy;
    
    btn.onclick = async () => {
      await navigator.clipboard.writeText(codeEl.innerText.trim());
      btn.innerHTML = iconCheck;
      setTimeout(() => { btn.innerHTML = iconCopy; }, 2000);
    };

    head.appendChild(label); head.appendChild(btn);
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(head); wrap.appendChild(pre);
  });

  document.querySelectorAll('table').forEach(t => {
    if (!t.parentNode.classList.contains('table-wrapper')) {
      const w = document.createElement('div'); w.className = 'table-wrapper';
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    }
  });

  // 4. Prism Final Pass
  Prism.highlightAll();
});
</script>
</body>
</html>
