<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Angel v9.0 - Math & Syntax Fixed</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hyperRushNet/hrn-ai/test-mdr9-l.css">

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/gh/hyperRushNet/hrn-ai/test-mdr11.js"></script>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #ffffff;
            color: #1a1a1a;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 850px; }
        
        /* Wiskunde Wrap Fix */
        .katex-display { 
            overflow-x: hidden !important; 
            white-space: normal !important;
            padding: 10px 0;
        }

        .streaming::after {
            content: '▊';
            display: inline-block;
            animation: blink 0.8s step-end infinite;
            color: #10b981;
            margin-left: 4px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <div id="render-target" class="da-body streaming"></div>
</div>

<script>
const content = `
# 🚀 Dark Angel v9

## 1. Advanced Mathematical Proof
Let's test if the non-scroll math logic holds up with a multi-line derivation. Notice how the indices and operators are rendered without clipping:
$$
\\oint_{C} \\mathbf{B} \\cdot d\\mathbf{l} = \\mu_0 \\left( I_{\\text{enc}} + \\varepsilon_0 \\frac{d\\Phi_E}{dt} \\right)
$$
And an inline challenge: Is the spacing of $\\psi(x,t) = A e^{i(kx-\\omega t)}$ correct when surrounded by heavy text?

## 2. High-Level System Logic (Syntax Test)
We are testing the **Prism.js** integration. This Python snippet uses f-strings, decorators, and type hinting—elements that often trip up basic highlighters:
\`\`\`python
@dataclass
class RenderEngine:
    version: str = "9.2.0"
    is_stable: bool = True

    async def stream_payload(self, raw_data: dict) -> str:
        # Testing syntax highlighting for f-strings and logic
        summary = f"Processing {len(raw_data)} chunks on v{self.version}"
        if not self.is_stable:
            raise Exception("Unstable Render State Detected")
        return summary.upper()
\`\`\`

## 3. The Responsive "Deep-Dive" Table
This table tests if your CSS can handle long English sentences and math symbols inside a fixed grid without breaking the container.

| Category | Technical Specification | Operational Status | Detailed Observations |
| :--- | :--- | :--- | :--- |
| **Quantics** | $H\\psi = E\\psi$ | 🟢 OPTIMAL | The wave function is stable across all dimensions of the viewport. |
| **Logic** | \`if (x > y) return x;\` | 🟡 PENDING | Testing if inline code blocks inside a table cell cause unwanted height expansion. |
| **Network** | 10.0.0.1/24 | 🔴 LATENCY | This very long description is here to ensure that the table-cell wraps the text properly instead of forcing a horizontal scrollbar on the user's screen. |

## 4. Nested Hierarchy & Quotes
> "The true test of a parser is not the simple text, but the chaos within the structure."
> 1. Level One
>    - Level Two (Unordered)
>        - **Level Three (Bold)**
>    - Back to Level Two
> 2. Back to Level \`One\`

---
**Challenge Status:** *Complete!*
`;

const target = document.getElementById('render-target');

function applyPlugins() {
    // Render KaTeX wiskunde
    if (window.renderMathInElement) {
        renderMathInElement(target, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ],
            throwOnError: false
        });
    }
    // Render Prism highlighting
    if (window.Prism) {
        Prism.highlightAllUnder(target);
    }
}

async function streamText(text) {
    // VEILIGHEIDSCHECK: Wacht tot marked beschikbaar is
    if (typeof marked === 'undefined') {
        console.error("Marked nog niet geladen, herproberen...");
        setTimeout(() => streamText(text), 100);
        return;
    }

    let i = 0;
    const bufferSize = 8;

    function update() {
        if (i <= text.length) {
            if (window.DarkAngel && DarkAngel.render) {
                DarkAngel.render(target, text.slice(0, i));
                applyPlugins();
            }
            i += bufferSize;
            requestAnimationFrame(update);
        } else {
            DarkAngel.render(target, text);
            applyPlugins();
            target.classList.remove('streaming');
        }
    }
    update();
}

// Start pas als alles in de window geladen is
window.addEventListener('load', () => {
    streamText(content);
});
</script>

</body>
</html>
