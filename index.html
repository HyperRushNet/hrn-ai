<style>
:root{--bg-base:#050505;--bg-surface:#0a0a0b;--bg-elevated:#141416;--border-subtle:rgba(255,255,255,0.1);--border-hover:rgba(255,255,255,0.2);--text-main:#f8fafc;--text-muted:#a1a1aa;--accent:#38bdf8;--accent-dim:rgba(56,189,248,0.15);--danger:#ef4444;--sidebar-w:280px;--content-width:740px;--msg-spacing:24px;--input-spacing:160px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#52525b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg-base);color:var(--text-main);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;height:100dvh;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none}
.lightbox-modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:20000;display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity 0.2s}
.lightbox-modal.show{opacity:1;pointer-events:auto}
.lightbox-close{position:absolute;top:20px;right:20px;color:white;cursor:pointer;padding:8px;background:rgba(255,255,255,0.1);border-radius:50%;z-index:10}
.lightbox-main-area{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:20px;padding-bottom:80px}
.lightbox-img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain;box-shadow:0 0 30px rgba(0,0,0,0.5)}
.lightbox-thumbs-wrapper{position:absolute;bottom:0;left:0;right:0;height:70px;background:linear-gradient(to top, rgba(0,0,0,0.8), transparent);display:flex;justify-content:center;align-items:center;padding-bottom:10px}
.lightbox-thumbs{display:flex;gap:8px}
.lightbox-thumb{width:50px;height:50px;border-radius:8px;object-fit:cover;cursor:pointer;opacity:0.5;border:2px solid transparent;transition:all 0.2s}
.lightbox-thumb.active{opacity:1;border-color:var(--accent);transform:scale(1.05)}
.pill-tag{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);padding:0 12px;height:28px;border-radius:50px;font-size:11px;font-weight:500;color:var(--accent);cursor:pointer;transition:all 0.15s;user-select:none;white-space:nowrap}
.pill-tag:hover{background:rgba(255,255,255,0.1);border-color:var(--accent)}
.pill-tag svg{width:14px;height:14px;flex-shrink:0}
.pill-remove{display:flex;align-items:center;justify-content:center;width:16px;height:16px;background:rgba(255,255,255,0.1);border-radius:50%;margin-left:4px;transition:background 0.15s}
.pill-remove:hover{background:var(--danger)}
.input-wrap{position:absolute;bottom:0;left:0;right:0;padding:16px 20px 24px 20px;background:linear-gradient(transparent, #050505 90%);pointer-events:none;z-index:10020;display:flex;flex-direction:column;align-items:center}
.attachment-preview-area{width:100%;max-width:680px;display:flex;gap:8px;margin-bottom:8px;overflow-x:auto;padding:4px 0;pointer-events:auto;align-items:center}
.toast-notification{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,30,35,0.95);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);padding:12px 20px;border-radius:12px;display:flex;align-items:center;gap:14px;z-index:10010;box-shadow:0 8px 32px rgba(0,0,0,0.5);opacity:0;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);pointer-events:none;max-width:calc(100% - 40px);width:max-content}
.toast-notification.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast-icon{width:20px;height:20px;color:var(--danger);flex-shrink:0}
.toast-content{display:flex;flex-direction:column;gap:2px}
.toast-title{font-size:13px;font-weight:600;color:var(--text-main)}
.toast-subtitle{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.toast-timer{font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:500}
@media(max-width:700px){.toast-notification{bottom:95px}}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99;opacity:0;pointer-events:none;transition:opacity 0.3s;backdrop-filter:blur(12px)}
body.sidebar-open .sidebar-overlay{opacity:1;pointer-events:auto}
.sidebar{width:var(--sidebar-w);background:var(--bg-surface);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;padding:16px;gap:12px;position:fixed;height:100%;z-index:100;transform:translateX(-100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1)}
@media(min-width:1024px){.sidebar{position:relative;transform:translateX(0)}.sidebar-overlay{display:none}}
body.sidebar-open .sidebar{transform:translateX(0)}
.new-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;background:transparent;border:1px solid var(--border-subtle);border-radius:12px;color:var(--text-main);cursor:pointer;font-size:14px;font-weight:500;transition:all 0.2s ease}
.new-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.chat-list{flex:1;overflow-y:auto}
.chat-item{padding:10px 12px;border-radius:8px;font-size:13px;color:var(--text-muted);cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;transition:background 0.15s}
.chat-item:hover{background:rgba(255,255,255,0.05);color:var(--text-main)}

.chat-title-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.chat-title{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;min-width:0}

.main{flex:1;display:flex;flex-direction:column;position:relative;min-width:0;overflow:hidden}
.header{height:54px;padding:0 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-subtle);background:rgba(5,5,5,0.9);backdrop-filter:blur(12px);z-index:10}

.chat-scroll{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}
.container{max-width:var(--content-width);margin:0 auto;padding-bottom:var(--input-spacing);width:100%}
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative;overflow:hidden}

.welcome-content{position:relative;z-index:1;max-width:600px;width:100%;animation:fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;opacity:0}

#welcome p{font-size:15px;color:var(--text-muted);margin-bottom:40px}
.suggestions-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.suggestion-card{position:relative;background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);border-radius:12px;padding:16px;text-align:left;cursor:pointer;transition:all 0.2s ease;overflow:hidden}
.suggestion-card:hover{border-color:rgba(56,189,248,0.4);background:rgba(56,189,248,0.05)}
.suggestion-card strong{display:block;font-size:14px;color:var(--text-main);font-weight:600;margin-bottom:4px}
.suggestion-card span{display:block;font-size:12px;color:var(--text-muted);line-height:1.4}
@media(max-width:640px){.suggestions-grid{display:none}#welcome h1{font-size:26px}.welcome-content{padding:0 10px}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.msg{width:100%;margin-top:var(--msg-spacing);animation:fadeIn 0.3s ease;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.msg.user .bubble{background:var(--bg-elevated);padding:10px 16px;border-radius:16px 16px 2px 16px;max-width:85%;font-size:14px;border:1px solid var(--border-subtle);line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;position:relative}
.edit-container{width:100%;display:flex;flex-direction:column;gap:8px}
.edit-msg-textarea{width:100%;background:var(--bg-base);border:1px solid var(--accent);color:var(--text-main);font-family:inherit;font-size:14px;padding:8px;border-radius:8px;resize:vertical;min-height:60px;outline:none}
.edit-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}

/* Markdown Body Styling - Integrated Parser Styles */
.md-body{font-size:15px;line-height:1.65;color:#e4e4e7;width:100%;overflow-wrap:break-word}
.md-body p{margin-bottom:12px}
.md-body strong{color:#fff;font-weight:600}
.md-body a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:all 0.2s}
.md-body a:hover{border-bottom-color:var(--accent)}
.md-body h1,.md-body h2,.md-body h3,.md-body h4,.md-body h5,.md-body h6{color:#fff;margin-top:24px;margin-bottom:12px;font-weight:600}
.md-body h1{font-size:1.6em;border-bottom:1px solid var(--border-subtle);padding-bottom:8px;margin-top:0}
.md-body h2{font-size:1.3em;border-bottom:1px solid var(--border-subtle);padding-bottom:6px}
.md-body h3{font-size:1.1em}
.md-body ul,.md-body ol{padding-left:24px;margin-bottom:12px}
.md-body li{margin-bottom:6px}
.md-body ul li::marker{color:var(--accent)}
.md-body .task-list-item{list-style:none;margin-left:-24px}
.md-body input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1px solid var(--border-hover);border-radius:4px;margin-right:8px;vertical-align:middle;cursor:pointer;position:relative;background:transparent}
.md-body input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent)}
.md-body input[type="checkbox"]:checked::after{content:'✔';color:#000;font-size:10px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.md-body blockquote{border-left:3px solid var(--accent);padding-left:16px;margin:16px 0;color:var(--text-muted);font-style:italic}
.md-body blockquote blockquote{border-left-color:var(--text-muted);margin:8px 0}
.md-body hr{border:none;height:1px;background:var(--border-subtle);margin:32px 0}
.md-body hr + *{margin-top:24px !important} /* Ensure space after HR */
.table-wrapper{width:100%;overflow-x:auto;margin:16px 0;border:1px solid var(--border-subtle);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}
th,td{padding:10px 14px;border-bottom:1px solid var(--border-subtle)}
th{background:rgba(255,255,255,0.05);font-weight:600;color:#fff}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.03)}

.code-header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border-subtle)}
.code-lang{font-size:11px;color:var(--accent);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.5px}
.code-content{overflow-x:auto}
pre{padding:14px;margin:0}
pre code{background:none !important;font-family:'JetBrains Mono',monospace;font-size:13px}
.actions{display:flex;gap:4px;margin-top:8px;opacity:0.4;transition:opacity 0.2s}
.msg:hover .actions{opacity:1}
.act-btn{background:none;border:none;color:#a1a1aa;cursor:pointer;padding:6px;border-radius:6px;transition:0.15s;display:flex;align-items:center}
.act-btn:hover{color:var(--accent);background:var(--accent-dim)}
.act-btn svg{width:16px;height:16px;stroke-width:2}
.input-box{max-width:680px;margin:0 auto;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:16px;display:flex;align-items:center;padding:10px 12px;gap:10px;pointer-events:auto;transition:border-color 0.2s,background 0.2s,box-shadow 0.2s;width:100%}
.input-box:focus-within{border-color:rgba(56,189,248,0.5);background:#0d0d0e;box-shadow:0 0 0 2px rgba(56,189,248,0.1)}
textarea{flex:1;background:transparent;border:none;color:#fff;font-family:inherit;font-size:15px;resize:none;outline:none;max-height:200px;padding:0;line-height:1.5}
.send-btn{width:34px;height:34px;border-radius:10px;border:none;background:var(--border-hover);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
.send-btn.active{background:var(--accent)}
.send-btn.active svg{stroke:#000}
.upload-btn{background:none;border:none;color:#71717a;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color 0.15s}

.loader{display:flex;gap:5px;padding:10px 0}
.loader span{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:bounce 1.4s infinite}
mjx-container{font-size:110% !important;pointer-events:none}
@keyframes bounce{0%,100%{opacity:0.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){:root{--msg-spacing:20px;--input-spacing:150px}.input-wrap{padding:14px 18px 22px 18px}}
@media(max-width:700px){:root{--msg-spacing:16px;--input-spacing:140px}.input-wrap{padding:12px 16px 20px 16px}}
@media(max-width:500px){:root{--msg-spacing:12px;--input-spacing:130px}.input-wrap{padding:10px 14px 18px 14px}.chat-scroll{padding:16px}}
</style>

<script>
class MarkdownParser {
    _escapeHtml(t) {
        return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    _sanitizeUrl(url) {
        try {
            const parsed = new URL(url);
            if (["http:", "https:", "mailto:", "tel:", "data:"].includes(parsed.protocol)) return url;
        } catch (e) {
            if (url.startsWith("/") || url.startsWith("#")) return url;
        }
        return "";
    }

    parse(text) {
        if (!text) return "";
        let t = text;
        const mathBlocks = [];
        const codeBlocks = [];
        const inlineCodes = [];

        // Math blocks
        t = t.replace(/\$\$([\s\S]*?)\$\$/g, (_, p1) => {
            mathBlocks.push(`\\[${p1}\\]`);
            return `%%MATH${mathBlocks.length - 1}%%`;
        });
        t = t.replace(/\$([^\$\n]+?)\$/g, (_, p1) => {
            mathBlocks.push(`\\(${p1}\\)`);
            return `%%MATH${mathBlocks.length - 1}%%`;
        });

        // Code blocks
        t = t.replace(/```(\w*)\n([\s\S]*?)(?:```|$)/g, (_, lang, code) => {
            codeBlocks.push(this._renderCodeBlock(code, lang));
            return `%%CODE${codeBlocks.length - 1}%%`;
        });

        // Inline code
        t = t.replace(/`([^`\n]+?)`/g, (_, p1) => {
            inlineCodes.push(`<code>${this._escapeHtml(p1)}</code>`);
            return `%%INLICODE${inlineCodes.length - 1}%%`;
        });

        // Escape HTML
        t = this._escapeHtml(t);

        // Parse structures
        t = this._parseTables(t);
        t = this._parseHR(t);
        t = this._parseHeaders(t);
        t = this._parseBlockquotes(t);
        t = this._parseLists(t);
        t = this._parseInline(t);
        t = this._parseParagraphs(t);

        // Restore placeholders
        inlineCodes.forEach((v, i) => { t = t.replace(`%%INLICODE${i}%%`, v); });
        mathBlocks.forEach((v, i) => { t = t.replace(`%%MATH${i}%%`, v); });
        codeBlocks.forEach((v, i) => { t = t.replace(`%%CODE${i}%%`, v); });

        return t;
    }

    _renderCodeBlock(code, lang) {
        const language = lang || "code";
        const safeCode = code.trim();
        let highlighted = this._escapeHtml(safeCode);
        try {
            if (lang && hljs.getLanguage(lang)) {
                highlighted = hljs.highlight(safeCode, { language: lang }).value;
            } else {
                highlighted = hljs.highlightAuto(safeCode).value;
            }
        } catch (e) {}
        return `<div class="code-block"><div class="code-header"><span class="code-lang">${language}</span><button class="act-btn" onclick="copyText(this, \`${encodeURIComponent(safeCode)}\`)" title="Copy code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button></div><div class="code-content"><pre><code class="hljs">${highlighted}</code></pre></div></div>`;
    }

    _parseTables(t) {
        return t.replace(/^\|(.+)\|\s*\n\|([-:\s|]+)\|\s*\n((?:\|.+\|\s*\n?)+)/gm, (match, headerRow, separator, bodyRows) => {
            const headers = headerRow.split("|").map(h => h.trim()).filter(h => h.length);
            const aligns = separator.split("|").map(s => {
                s = s.trim();
                if (s.startsWith(":") && s.endsWith(":")) return "text-center";
                if (s.endsWith(":")) return "text-right";
                return "text-left";
            });
            
            const thead = "<thead><tr>" + headers.map((h, i) => `<th class="${aligns[i] || ""}">${h}</th>`).join("") + "</tr></thead>";
            const tbody = "<tbody>" + bodyRows.trim().split("\n").map(row => {
                const cells = row.split("|").map(c => c.trim()).filter(c => c.length);
                return "<tr>" + cells.map((c, i) => `<td class="${aligns[i] || ""}">${c}</td>`).join("") + "</tr>";
            }).join("") + "</tbody>";
            
            return `<div class="table-wrapper"><table>${thead}${tbody}</table></div>`;
        });
    }
    
    _parseHR(t) {
        // HR parsing with spacing logic handled by CSS
        return t.replace(/^ {0,3}[-*_]{3,} *$/gm, "<hr>");
    }

    _parseHeaders(t) {
        return t.replace(/^ {0,3}(#{1,6}) +(.*)$/gm, (m, h, c) => `<h${h.length}>${c}</h${h.length}>`);
    }
    
    _parseBlockquotes(t) {
        const lines = t.split('\n');
        let res = [];
        let stack = [];
        for (let line of lines) {
            let match = line.match(/^( {0,3}(&gt;) ?)(.*)$/);
            if (match) {
                let content = match[3];
                let depth = (line.match(/&gt;/g) || []).length;
                
                while (stack.length < depth) {
                    res.push("<blockquote>");
                    stack.push(true);
                }
                while (stack.length > depth) {
                    res.push("</blockquote>");
                    stack.pop();
                }
                res.push(content + "<br>");
            } else {
                while (stack.length > 0) {
                    res.push("</blockquote>");
                    stack.pop();
                }
                res.push(line);
            }
        }
        while (stack.length > 0) {
            res.push("</blockquote>");
            stack.pop();
        }
        return res.join('\n');
    }

    _parseLists(t) {
        const lines = t.split('\n');
        let res = [];
        let stack = [];
        
        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];
            let match = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
            
            if (match) {
                let indent = match[1].length;
                let type = match[2].match(/\d/) ? 'ol' : 'ul';
                let content = match[3];
                let checked = null;
                
                if (type === 'ul') {
                    let taskMatch = content.match(/^\[([ xX])\]\s+(.*)$/);
                    if (taskMatch) {
                        checked = taskMatch[1].toLowerCase() === 'x';
                        content = taskMatch[2];
                    }
                }

                if (stack.length === 0) {
                    res.push(`<${type}>`);
                    stack.push({type, indent});
                } else {
                    let last = stack[stack.length - 1];
                    if (indent > last.indent) {
                        res.push(`<${type}>`);
                        stack.push({type, indent});
                    } else if (indent < last.indent) {
                        while(stack.length > 0 && stack[stack.length - 1].indent > indent) {
                            let popped = stack.pop();
                            res.push(`</${popped.type}>`);
                        }
                        if (stack.length === 0 || stack[stack.length - 1].indent < indent) {
                             res.push(`<${type}>`);
                             stack.push({type, indent});
                        }
                    }
                }
                
                let liClass = checked !== null ? ' class="task-list-item"' : '';
                let checkbox = checked !== null ? `<input type="checkbox" ${checked ? 'checked' : ''} disabled>` : '';
                res.push(`<li${liClass}>${checkbox}${content}</li>`);
            } else {
                while(stack.length > 0) {
                    let popped = stack.pop();
                    res.push(`</${popped.type}>`);
                }
                res.push(line);
            }
        }
        while(stack.length > 0) {
            let popped = stack.pop();
            res.push(`</${popped.type}>`);
        }
        return res.join('\n');
    }

    _parseInline(t) {
        t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m, alt, url) => {
            const safeUrl = this._sanitizeUrl(url);
            return `<img src="${safeUrl}" alt="${alt}" style="max-width:100%;border-radius:8px;margin:8px 0;">`;
        });
        t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, text, url) => {
            const safeUrl = this._sanitizeUrl(url);
            return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${text}</a>`;
        });
        t = t.replace(/\*\*\*([^*\n]+)\*\*\*/g, "<strong><em>$1</em></strong>");
        t = t.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
        t = t.replace(/__([^_\n]+)__/g, "<strong>$1</strong>");
        t = t.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
        t = t.replace(/_([^_\n]+)_/g, "<em>$1</em>");
        t = t.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
        return t;
    }

    _parseParagraphs(t) {
        return t.split(/\n\n+/).map(block => {
            block = block.trim();
            if (!block) return "";
            // Check if it's already a block element
            if (block.match(/^<(h[1-6]|ul|ol|li|blockquote|hr|div|p|pre|code|table)/)) {
                return block;
            }
            // Check if it's a placeholder for code/math
            if (block.match(/^%%(CODE|MATH|INLICODE)\d+%%$/)) {
                return block;
            }
            return `<p>${block.replace(/\n/g, "<br>")}</p>`;
        }).join("\n");
    }
}

function _initDB() { 
    return new Promise((resolve, reject) => { 
        const request = indexedDB.open(DB_NAME, 1); 
        request.onerror = (e) => reject("IndexedDB error: " + e.target.error); 
        request.onsuccess = (e) => { db = e.target.result; resolve(db); }; 
        request.onupgradeneeded = (e) => { 
            const database = e.target.result; 
            if (!database.objectStoreNames.contains(DB_STORE)) { 
                database.createObjectStore(DB_STORE, { keyPath: "id" }); 
            } 
        }; 
    }); 
}

function _dbOperation(mode, operation) { 
    return new Promise((resolve, reject) => { 
        if (!db) return reject("DB not init"); 
        const transaction = db.transaction(DB_STORE, mode); 
        const store = transaction.objectStore(DB_STORE); 
        const request = operation(store); 
        request.onsuccess = () => resolve(request.result); 
        request.onerror = () => reject(request.error); 
    }); 
}

function _saveChatsToDB() { 
    const data = { id: "main_history", chats: CHATS }; 
    return _dbOperation("readwrite", store => store.put(data)); 
}

function _loadChatsFromDB() { 
    return _dbOperation("readonly", store => store.get("main_history")).then(data => { 
        return data ? data.chats : [];

    const now = new Date(); 
    const nextHour = new Date(now); 
    nextHour.setHours(nextHour.getHours() + 1, 0, 0, 0); 
    const diff = nextHour - now; 
    if (diff <= 0) {

    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
