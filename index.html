<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
      <title>HyperRush AI</title>
      <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/128/18548/18548385.png">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
      <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
      <style>
         :root{--bg-base:#050505;--bg-surface:#0a0a0b;--bg-elevated:#141416;--border-subtle:rgba(255,255,255,0.06);--border-hover:rgba(255,255,255,0.12);--text-main:#f0f0f0;--text-muted:#71717a;--accent:#7dd3fc;--accent-dim:rgba(125,211,252,0.1);--sidebar-w:280px;--content-width:740px}
         ::-webkit-scrollbar{width:6px;height:6px}
         ::-webkit-scrollbar-track{background:transparent}
         ::-webkit-scrollbar-thumb{background:#27272a;border-radius:10px}
         ::-webkit-scrollbar-thumb:hover{background:#3f3f46}
         *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
         body{background:var(--bg-base);color:var(--text-main);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;height:100dvh;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none}
         .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99;opacity:0;pointer-events:none;transition:opacity 0.3s;backdrop-filter:blur(12px)}
         body.sidebar-open .sidebar-overlay{opacity:1;pointer-events:auto}
         .sidebar{width:var(--sidebar-w);background:var(--bg-surface);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;padding:16px;gap:12px;position:fixed;height:100%;z-index:100;transform:translateX(-100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1)}
         @media(min-width:1024px){.sidebar{position:relative;transform:translateX(0)}.sidebar-overlay{display:none}}
         body.sidebar-open .sidebar{transform:translateX(0)}
         .new-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;background:transparent;border:1px solid var(--border-subtle);border-radius:12px;color:var(--text-main);cursor:pointer;font-size:14px;font-weight:500;transition:all 0.2s ease}
         .new-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
         .new-btn:active{transform:scale(0.98)}
         .chat-list{flex:1;overflow-y:auto}
         .chat-item{padding:10px 12px;border-radius:8px;font-size:13px;color:var(--text-muted);cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;transition:background 0.15s}
         .chat-item:hover{background:rgba(255,255,255,0.03);color:var(--text-main)}
         .chat-item.active{background:var(--accent-dim);color:var(--accent)}
         .chat-title{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:10px;display:block}
         .main{flex:1;display:flex;flex-direction:column;position:relative;min-width:0}
         .header{height:54px;padding:0 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-subtle);background:rgba(5,5,5,0.8);backdrop-filter:blur(12px);z-index:10}
         .menu-btn{background:none;border:none;color:#fff;cursor:pointer;padding:5px;opacity:0.7}
         @media(min-width:1024px){.menu-btn{display:none}}
         
         /* Language Selector Styles */
         .lang-selector{position:relative;margin-left:auto;margin-right:15px;z-index:50}
         .lang-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);border-radius:8px;color:var(--text-main);cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;transition:all 0.2s}
         .lang-btn:hover{border-color:var(--accent);background:var(--accent-dim)}
         .lang-btn svg{width:14px;height:14px;stroke:var(--accent)}
         .lang-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:280px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,0.5);opacity:0;visibility:hidden;transform:translateY(-10px);transition:all 0.2s cubic-bezier(0.4,0,0.2,1)}
         .lang-dropdown.open{opacity:1;visibility:visible;transform:translateY(0)}
         .lang-search{padding:12px;border-bottom:1px solid var(--border-subtle)}
         .lang-search input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);border-radius:8px;padding:8px 12px;color:var(--text-main);font-size:13px;outline:none;font-family:inherit}
         .lang-search input:focus{border-color:var(--accent)}
         .lang-search input::placeholder{color:var(--text-muted)}
         .lang-list{max-height:320px;overflow-y:auto;padding:8px}
         .lang-list::-webkit-scrollbar{width:4px}
         .lang-list::-webkit-scrollbar-track{background:transparent}
         .lang-list::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:10px}
         .lang-list::-webkit-scrollbar-thumb:hover{background:#52525b}
         .lang-option{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background 0.15s;font-size:13px}
         .lang-option:hover{background:rgba(255,255,255,0.05)}
         .lang-option.selected{background:var(--accent-dim);color:var(--accent)}
         .lang-option .lang-code{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);background:rgba(255,255,255,0.05);padding:2px 6px;border-radius:4px}
         .lang-option.selected .lang-code{background:rgba(125,211,252,0.2);color:var(--accent)}
         .lang-flag{font-size:16px;width:24px;text-align:center}
         
         .chat-scroll{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}
         .container{max-width:var(--content-width);margin:0 auto;padding-bottom:160px;width:100%}
         #welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative;overflow:hidden}
         #welcome::before{content:'';position:absolute;top:20%;left:50%;transform:translate(-50%,-50%);width:800px;height:600px;background:radial-gradient(circle,rgba(125,211,252,0.08) 0%,transparent 60%);pointer-events:none;filter:blur(60px)}
         .welcome-content{position:relative;z-index:1;max-width:600px;width:100%;animation:fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;opacity:0}
         #welcome h1{font-size:30px;font-weight:600;letter-spacing:-0.5px;background:linear-gradient(135deg,#fff 0%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
         #welcome p{font-size:15px;color:var(--text-muted);margin-bottom:40px}
         .suggestions-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
         .suggestion-card{position:relative;background:rgba(255,255,255,0.02);border:1px solid var(--border-subtle);border-radius:12px;padding:16px;text-align:left;cursor:pointer;transition:all 0.2s ease;overflow:hidden}
         .suggestion-card:hover{border-color:rgba(125,211,252,0.3);background:rgba(125,211,252,0.03)}
         .suggestion-card strong{display:block;font-size:14px;color:var(--text-main);font-weight:600;margin-bottom:4px}
         .suggestion-card span{display:block;font-size:12px;color:var(--text-muted);line-height:1.4}
         @media(max-width:640px){.suggestions-grid{display:none}#welcome h1{font-size:26px}.welcome-content{padding:0 10px}.lang-selector{display:none}}
         @keyframes fadeInUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
         .msg{width:100%;margin-top:24px;animation:fadeIn 0.3s ease;display:flex;flex-direction:column}
         .msg.user{align-items:flex-end}
         .msg.user .bubble{background:var(--bg-elevated);padding:10px 16px;border-radius:16px 16px 2px 16px;max-width:85%;font-size:14px;border:1px solid var(--border-subtle);line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
         .md-body{font-size:15px;line-height:1.65;color:#d4d4d8;width:100%;overflow-wrap:break-word}
         .md-body p{margin-bottom:12px}
         .md-body strong{color:#fff;font-weight:600}
         .md-body a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:all 0.2s}
         .md-body a:hover{border-bottom-color:var(--accent)}
         .md-body h1,.md-body h2,.md-body h3{color:#fff;margin-top:24px;margin-bottom:12px;font-weight:600}
         .md-body h1{font-size:1.6em;border-bottom:1px solid var(--border-subtle);padding-bottom:8px}
         .md-body h2{font-size:1.3em}
         .md-body h3{font-size:1.1em}
         .md-body ul,.md-body ol{padding-left:24px;margin-bottom:12px}
         .md-body li{margin-bottom:6px}
         .md-body ul li::marker{color:var(--accent)}
         .md-body .task-list-item{list-style:none;margin-left:-24px}
         .md-body input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1px solid var(--border-hover);border-radius:4px;margin-right:8px;vertical-align:middle;cursor:pointer;position:relative;background:transparent}
         .md-body input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent)}
         .md-body input[type="checkbox"]:checked::after{content:'✔';color:#000;font-size:10px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
         .table-wrapper{width:100%;overflow-x:auto;margin:16px 0;border:1px solid var(--border-subtle);border-radius:8px}
         table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}
         th,td{padding:10px 14px;border-bottom:1px solid var(--border-subtle)}
         th{background:rgba(255,255,255,0.03);font-weight:600;color:#fff}
         tr:last-child td{border-bottom:none}
         tr:hover td{background:rgba(255,255,255,0.02)}
         .code-block{margin:16px 0;border:1px solid var(--border-subtle);border-radius:10px;background:#09090b;overflow:hidden}
         .code-header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border-subtle)}
         .code-lang{font-size:11px;color:var(--accent);font-family:'JetBrains Mono';text-transform:uppercase;letter-spacing:0.5px}
         .code-content{overflow-x:auto}
         pre{padding:14px;margin:0}
         pre code{background:none !important;font-family:'JetBrains Mono',monospace;font-size:13px}
         .actions{display:flex;gap:4px;margin-top:8px;opacity:0.5;transition:opacity 0.2s}
         .msg:hover .actions{opacity:1}
         .act-btn{background:none;border:none;color:#71717a;cursor:pointer;padding:6px;border-radius:6px;transition:0.15s;display:flex;align-items:center}
         .act-btn:hover{color:var(--accent);background:var(--accent-dim)}
         .act-btn svg{width:16px;height:16px;stroke-width:2}
         .input-wrap{position:absolute;bottom:0;left:0;right:0;padding:16px 20px 24px 20px;background:linear-gradient(transparent,#050505 90%);pointer-events:none}
         .input-box{max-width:680px;margin:0 auto;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:16px;display:flex;align-items:center;padding:10px 16px;gap:12px;pointer-events:auto;transition:border-color 0.2s,background 0.2s,box-shadow 0.2s}
         .input-box:focus-within{border-color:rgba(125,211,252,0.4);background:#0a0a0b;box-shadow:0 0 0 1px rgba(125,211,252,0.1)}
         textarea{flex:1;background:transparent;border:none;color:#fff;font-family:inherit;font-size:15px;resize:none;outline:none;max-height:200px;padding:0;line-height:1.5}
         .send-btn{width:34px;height:34px;border-radius:10px;border:none;background:var(--border-hover);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
         .send-btn.active{background:var(--accent)}
         .send-btn.active svg{stroke:#000}
         .loader{display:flex;gap:5px;padding:10px 0}
         .loader span{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:bounce 1.4s infinite}
         mjx-container{font-size:110% !important;pointer-events:none}
         @keyframes bounce{0%,100%{opacity:0.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
         @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
         @media(max-width:600px){.container{padding-bottom:140px}.input-wrap{padding:12px}}
      </style>
   </head>
   <body>
      <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
      <div class="sidebar" id="sidebar">
         <div class="sidebar-header">
            <button class="new-btn" onclick="newChat()" style="width:100%">
               <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
               </svg>
               New Chat
            </button>
         </div>
         <div class="chat-list" id="chat-list"></div>
      </div>
      <div class="main">
         <div class="header">
            <button class="menu-btn" onclick="toggleSidebar()">
               <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="3" y1="12" x2="21" y2="12"></line>
                  <line x1="3" y1="6" x2="21" y2="6"></line>
                  <line x1="3" y1="18" x2="21" y2="18"></line>
               </svg>
            </button>
            <div id="balance" style="font-size:11px;color:#3f3f46;font-family:'JetBrains Mono',monospace;letter-spacing:0.3px">...</div>
            
            <!-- Language Selector -->
            <div class="lang-selector" id="langSelector">
               <button class="lang-btn" onclick="toggleLangDropdown()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                     <circle cx="12" cy="12" r="10"></circle>
                     <line x1="2" y1="12" x2="22" y2="12"></line>
                     <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                  </svg>
                  <span id="currentLangCode">EN</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px">
                     <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
               </button>
               <div class="lang-dropdown" id="langDropdown">
                  <div class="lang-search">
                     <input type="text" id="langSearch" placeholder="Search language..." oninput="filterLanguages()">
                  </div>
                  <div class="lang-list" id="langList"></div>
               </div>
            </div>
         </div>
         <div id="welcome">
            <div class="welcome-content">
               <h1>HyperRush AI</h1>
               <p>From prompt to perfection.</p>
               <div class="suggestions-grid">
                  <div class="suggestion-card" onclick="startSuggestion('Explain quantum physics like I\'m 5 years old')">
                     <strong>Explain Concept</strong>
                     <span>"Explain quantum physics simply"</span>
                  </div>
                  <div class="suggestion-card" onclick="startSuggestion('Write a Python script for a password generator')">
                     <strong>Write Code</strong>
                     <span>"Python password generator"</span>
                  </div>
                  <div class="suggestion-card" onclick="startSuggestion('Give me 5 tips to be more productive working from home')">
                     <strong>Ask Advice</strong>
                     <span>"Tips for working from home"</span>
                  </div>
                  <div class="suggestion-card" onclick="startSuggestion('Invent a creative story about a robot in nature')">
                     <strong>Creativity</strong>
                     <span>"Invent a short story"</span>
                  </div>
               </div>
            </div>
         </div>
         <div id="chat-view" class="chat-scroll" style="display:none">
            <div class="container" id="chat-container"></div>
         </div>
         <div class="input-wrap">
            <div class="input-box">
               <textarea id="prompt" placeholder="Ask a question..." rows="1"></textarea>
               <button id="send-btn" class="send-btn" onclick="handleSendOrStop()">
                  <svg id="icon-send" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                     <path d="M12 19V5M5 12l7-7 7 7"/>
                  </svg>
                  <svg id="icon-stop" width="18" height="18" viewBox="0 0 24 24" fill="black" style="display:none">
                     <rect x="6" y="6" width="12" height="12" rx="1"/>
                  </svg>
               </button>
            </div>
         </div>
      </div>

        const s = (await fetch(`${API_BASE}/v1/chat/completions`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${PK}`
                },
                body: JSON.stringify({
                    model: "gemini-search",
                    messages: [{
                        role: "system",
                        content: SYS_PROMPT
                    }, ...e.messages],
                    stream: !0,
                    seed: Math.floor(1e6 * Math.random())
                }),
                signal: abortController.signal
            })).body.getReader(),
            o = new TextDecoder;
        let a = "";
        for (;;) {
            const {
                done: r,
                value: i
            } = await s.read();
            if (r) break;
            a += o.decode(i, {
                stream: !0
            });
            const l = a.split("\n");
            a = l.pop();
            for (const s of l) {
                if (!s.trim().startsWith("data: ")) continue;
                const o = s.trim().slice(6);
                if ("[DONE]" === o) break;
                try {
                    const e = JSON.parse(o),
                        s = e.choices && e.choices[0] && e.choices[0].delta && e.choices[0].delta.content;
                    s && (n += s, t.innerHTML = mdParser.parse(n), renderMathLive(t), document.getElementById("chat-view").scrollTop = document.getElementById("chat-view").scrollHeight)
                } catch (e) {}
            }
        }
        e.messages[e.messages.length - 1] = {
            role: "assistant",
            content: n
        }, localStorage.setItem("gem_v15", JSON.stringify(CHATS)), updateBalance()
    } catch (e) {
        console.error(e)
    }
}
init();
</script>
